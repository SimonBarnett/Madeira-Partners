  Usage Instructions for Partners:
  This is the authenticated Embed Code / catalog preview page (menu-config.json →
  Embed Code → /catalog.html, roles community). It is not the public home page.

  1. Header Widget:
     - <header data-header-widget data-page-name="Catalog" data-requireToken="true">
     - data-requireToken must be "true". Unauthenticated visitors are redirected
       to loginUrl from index.json.
     - Script: https://madeira-widget-bucket.s3.eu-west-2.amazonaws.com/header-widget.js

  2. Catalog Preview Widget:
     - Add <div id="catalog-preview-widget"></div>
     - Script: https://madeira-widget-bucket.s3.eu-west-2.amazonaws.com/catalog-preview-widget.js
     - The widget renders embed snippets for the signed-in community catalogue.

  3. Configuration:
     - index.json and menu-config.json already ship with this kit at the site root.
     - Replace affiliateCode in index.json with your partner code. Do not create
       new copies of files that already exist.

  4. Footer:
     - <footer id="footer"></footer> plus the fetch('footer.html') script below.

  5. Authentication:
     - The header widget checks authToken in localStorage. See README security notes.

  For support, see README.md or email support@clubmadeira.io.
-->

<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Set character encoding and responsive viewport -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Page title, customizable for your site -->
    <title>Catalog</title>
    <!-- Link to custom CSS for styling the page -->
    <link rel="stylesheet" href="css/page.css">
</head>

<body>
    <!-- Header widget for navigation and authentication -->
    <header 
        data-header-widget 
        data-page-name="Catalog" 
        data-requireToken="true"
    >
        <!-- The header content is dynamically generated by header-widget.js -->
    </header>
    <!-- Load the header widget script from S3 -->
    <script src="https://madeira-widget-bucket.s3.eu-west-2.amazonaws.com/header-widget.js"></script>

    <!-- Main content area for page-specific content -->
    <main>
        <!-- Welcome section with introductory content and role widget -->
        <section class="categories">                 
            <div id="catalog-preview-widget"></div>
            <script src="https://madeira-widget-bucket.s3.eu-west-2.amazonaws.com/catalog-preview-widget.js"></script>            
        </section>
    </main>

    <!-- Footer element for dynamic or static content -->
    <footer id="footer">
        <!-- Footer content will be loaded dynamically from footer.html -->
    </footer>
    <!-- Script to dynamically load footer content -->
    <script>
        // Fetch footer.html and insert its content into the footer element
        fetch('footer.html')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Failed to load footer.html');
                }
                return response.text();
            })
            .then(data => {
                document.getElementById('footer').innerHTML = data;
            })
            .catch(error => {
                console.error('Error loading footer:', error.message);
                // Set fallback content if footer.html fails to load
                document.getElementById('footer').innerHTML = '<p>Footer content unavailable</p>';
            });
    </script>

</body>
</html>
