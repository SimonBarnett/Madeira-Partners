<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merchant Parts</title>
    <link rel="stylesheet" href="css/page.css">
</head>
<body>
    <header data-header-widget data-page-name="Merchant Parts" data-requireToken="true">
        <!-- Header content generated by header-widget.js -->
    </header>
    <script src="https://madeira-widget-bucket.s3.eu-west-2.amazonaws.com/header-widget.js"></script>

    <main>
        <section class="merchant-parts">            
            <div id="merchant-parts-widget">
                <!-- The merchant parts widget will render here -->
            </div>
            <script 
                src="https://madeira-widget-bucket.s3.eu-west-2.amazonaws.com/merchant-parts.js"
                data-container-id="merchant-parts-widget"
            ></script>
        </section>
    </main>

    <footer id="footer">
        <!-- Footer content will be loaded dynamically -->
    </footer>
    <script>
        fetch('footer.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('footer').innerHTML = data;
            })
            .catch(error => {
                console.error('Error loading footer:', error);
                document.getElementById('footer').innerHTML = '<p>Footer content unavailable</p>';
            });
    </script>
</body>
</html>
